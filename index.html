<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador Técnico - Lubricentro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 12px;
      background: #0f172a;
      color: #1e293b;
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 1.35rem; color: #0f172a; }
    h2 { margin: 20px 0 10px; font-size: 1.1rem; color: #1e3a8a; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    label { display: block; margin: 12px 0 4px; font-weight: 700; font-size: 0.85rem; color: #334155; }
    input, select, button {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    input.mayus { text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    button {
      margin-top: 12px;
      border: 0;
      background: #1d4ed8;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    .btn-sec { background: #475569; width: auto; padding: 8px 14px; margin-top: 0; font-size: 0.85rem; }
    .btn-verde { background: #15803d; }
    .btn-verde:hover { background: #166534; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel-busqueda {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 14px;
      border-radius: 10px;
    }
    #resultado {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 10px;
    }
    .bloque-tecnico {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .tag-atf { background: #fef3c7; color: #92400e; }
    .dato { margin: 5px 0; font-size: 0.93rem; }
    .cotizador {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 14px;
      border-radius: 8px;
      margin-top: 14px;
    }
    .total-box {
      font-size: 1.2rem;
      font-weight: 800;
      color: #14532d;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #93c5fd;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      padding: 16px;
      overflow-y: auto;
      z-index: 50;
    }
    .modal-box {
      background: #fff;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🛢️ Mostrador Técnico y Presupuestos</h1>
      <button type="button" class="btn-sec" onclick="abrirModal()">+ Cargar Patente / Ficha</button>
    </header>

    <!-- BÚSQUEDA RÁPIDA POR PATENTE O VIN -->
    <form id="form-codigo" class="panel-busqueda">
      <label for="input-codigo">Buscar por Patente (base propia) o VIN (17 caracteres)</label>
      <input type="text" id="input-codigo" class="mayus" placeholder="Ej: AB123CD o 8AFZZZ..." maxlength="17" required>
      <button type="submit" id="btn-codigo">Buscar Vehículo</button>
    </form>

    <!-- BÚSQUEDA POR MARCA / MODELO -->
    <form id="form-manual" style="margin-top: 14px;">
      <div class="grid-2">
        <div>
          <label for="marca">Marca</label>
          <select id="marca"><option value="">Seleccionar...</option></select>
        </div>
        <div>
          <label for="modelo">Modelo</label>
          <select id="modelo" disabled><option value="">Elegí marca...</option></select>
        </div>
        <div>
          <label for="anio">Año</label>
          <select id="anio" disabled><option value="">Elegí modelo...</option></select>
        </div>
        <div>
          <label for="version">Versión / Motor / Caja</label>
          <select id="version" disabled><option value="">Elegí año...</option></select>
        </div>
      </div>
      <button type="submit" class="btn-verde">Consultar Ficha Técnica</button>
    </form>

    <!-- FICHA TÉCNICA Y COTIZADOR -->
    <div id="resultado" aria-live="polite"></div>
  </main>

  <!-- MODAL PARA GUARDAR CLIENTE O VEHÍCULO NUEVO -->
  <div id="modal-nuevo" class="modal">
    <div class="modal-box">
      <h2>Guardar vehículo / patente en este dispositivo</h2>
      <form id="form-guardar">
        <div class="grid-2">
          <div>
            <label>Patente (opcional)</label>
            <input type="text" id="n-patente" class="mayus" placeholder="AE123BC">
          </div>
          <div>
            <label>VIN (opcional)</label>
            <input type="text" id="n-vin" class="mayus" maxlength="17">
          </div>
          <div>
            <label>Marca *</label>
            <input type="text" id="n-marca" required placeholder="Ej: Volkswagen">
          </div>
          <div>
            <label>Modelo *</label>
            <input type="text" id="n-modelo" required placeholder="Ej: Polo">
          </div>
          <div>
            <label>Año *</label>
            <input type="number" id="n-anio" required placeholder="2018">
          </div>
          <div>
            <label>Versión / Motor *</label>
            <input type="text" id="n-version" required placeholder="1.6 MSI 16v AT">
          </div>
          <div>
            <label>Código Motor</label>
            <input type="text" id="n-motor-cod" placeholder="EA211 / CWSA">
          </div>
          <div>
            <label>Caja y Código</label>
            <input type="text" id="n-caja" placeholder="Automática Aisin 09G / AQ160">
          </div>
        </div>

        <h2>Datos Aceite Motor</h2>
        <div class="grid-2">
          <div>
            <label>Viscosidad y Norma</label>
            <input type="text" id="n-mot-aceite" placeholder="5W-40 • VW 502.00">
          </div>
          <div>
            <label>Litros Motor (con filtro)</label>
            <input type="number" step="0.1" id="n-mot-litros" placeholder="4.0">
          </div>
        </div>

        <h2>Datos Caja Automática (Diálisis)</h2>
        <div class="grid-2">
          <div>
            <label>Fluido ATF y Norma</label>
            <input type="text" id="n-atf-norma" placeholder="ATF VI / Toyota WS / G 055 540">
          </div>
          <div>
            <label>Litros para Diálisis (total + barrido)</label>
            <input type="number" step="0.5" id="n-atf-litros" placeholder="10">
          </div>
          <div>
            <label>Filtro de Caja (Interno / Cartucho)</label>
            <input type="text" id="n-filtro-caja" placeholder="Ej: Wega WFC-950 / Kit junta">
          </div>
          <div>
            <label>Filtros Motor (Aceite / Aire / Comb / Hab)</label>
            <input type="text" id="n-filtros-mot" placeholder="WO-360 / FAP-3288 / FCI-1630">
          </div>
        </div>

        <div class="grid-2" style="margin-top: 14px;">
          <button type="button" class="btn-sec" style="width:100%" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-verde" style="margin-top:0">Guardar Ficha</button>
        </div>
      </form>
    </div>
  </div>
