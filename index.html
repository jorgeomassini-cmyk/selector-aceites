<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de lubricantes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
      color: #202124;
    }
    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }
    input { width: min(100%, 390px); border: 1px solid #aaa; }
    button { border: 0; background: #1769aa; color: white; cursor: pointer; }
    #resultado { margin-top: 24px; padding: 16px; background: #f3f6f8; border-radius: 10px; }
    .aviso { color: #765500; }
  </style>
</head>
<body>
  <h1>Selector de lubricantes</h1>
  <p>Ingresá el VIN para identificar el vehículo.</p>

  <form id="formulario">
    <input id="vin" placeholder="VIN de 17 caracteres" maxlength="17"
           aria-label="VIN" required>
    <button type="submit">Buscar vehículo</button>
  </form>

  <div id="resultado" aria-live="polite">Los datos del vehículo aparecerán acá.</div>

  <script>
    const formulario = document.querySelector("#formulario");
    const campoVin = document.querySelector("#vin");
    const resultado = document.querySelector("#resultado");

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const vin = campoVin.value.trim().toUpperCase();

      if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) {
        resultado.textContent = "Revisá el VIN: debe tener 17 caracteres.";
        return;
      }

      resultado.textContent = "Buscando datos del vehículo…";

      try {
        const url =
          `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/${encodeURIComponent(vin)}?format=json`;
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No se pudo consultar el servicio.");

        const datos = await respuesta.json();
        const vehiculo = datos.Results?.[0];

        if (!vehiculo || (!vehiculo.Make && !vehiculo.Model)) {
          resultado.textContent =
            "No encontramos datos para ese VIN. Verificá que esté bien escrito.";
          return;
        }

        const campos = [
          ["Marca", vehiculo.Make],
          ["Modelo", vehiculo.Model],
          ["Año", vehiculo.ModelYear],
          ["Motor", vehiculo.DisplacementL
            ? `${vehiculo.DisplacementL} L`
            : vehiculo.EngineModel],
          ["Combustible", vehiculo.FuelTypePrimary],
          ["Transmisión", vehiculo.TransmissionStyle]
        ];

        resultado.replaceChildren();
        const titulo = document.createElement("h2");
        titulo.textContent = "Vehículo identificado";
        resultado.append(titulo);

        const lista = document.createElement("ul");
        for (const [etiqueta, valor] of campos) {
          if (valor) {
            const item = document.createElement("li");
            item.textContent = `${etiqueta}: ${valor}`;
            lista.append(item);
          }
        }
        resultado.append(lista);

        const aviso = document.createElement("p");
        aviso.className = "aviso";
        aviso.textContent =
          "Aceites: sin recomendación verificada todavía. Confirmá motor y transmisión con el manual del fabricante.";
        resultado.append(aviso);
      } catch (error) {
        resultado.textContent =
          "No pudimos consultar el servicio. Revisá tu conexión e intentá de nuevo.";
      }
    });
  </script>
</body>
</html>
