<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de aceite</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px #17203318;
    }

    h1 { margin-top: 0; color: #14532d; }
    p { line-height: 1.5; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #15803d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #166534; }

    #resultado {
      display: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 10px;
      background: #dcfce7;
      line-height: 1.6;
    }

    .aviso {
      margin-top: 20px;
      padding: 12px;
      background: #fff7ed;
      border-radius: 9px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🛢️ Selector de aceite</h1>
    <p>Ingresá las especificaciones que indica el manual de tu vehículo para saber qué buscar en el envase.</p>

    <form id="formulario">
      <label for="vehiculo">Vehículo (opcional)</label>
      <input id="vehiculo" type="text" placeholder="Ej.: Fiat Cronos 1.3 2020">

      <label for="viscosidad">Viscosidad indicada en el manual</label>
      <select id="viscosidad" required>
        <option value="">Elegí una opción</option>
        <option>0W-20</option>
        <option>0W-30</option>
        <option>5W-30</option>
        <option>5W-40</option>
        <option>10W-40</option>
        <option>15W-40</option>
        <option>Otra: revisar manual</option>
      </select>

      <label for="norma">Norma o especificación del fabricante (opcional)</label>
      <input id="norma" type="text" placeholder="Ej.: API, ACEA o norma de la marca">

      <button type="submit">Ver qué aceite buscar</button>
    </form>

    <section id="resultado" aria-live="polite"></section>

    <div class="aviso">
      <strong>Importante:</strong> la viscosidad y las normas deben coincidir con el manual del vehículo. No elijas el aceite solo por el año o el kilometraje.
    </div>
  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      const vehiculo = document.getElementById("vehiculo").value.trim();
      const viscosidad = document.getElementById("viscosidad").value;
      const norma = document.getElementById("norma").value.trim();

      resultado.style.display = "block";
      resultado.innerHTML = `
        <strong>Qué buscar:</strong><br>
        Un aceite con viscosidad <strong>${viscosida
        ${vehiculo ? `<br><br>Vehículo ingresado: <strong>${escaparHTML(vehiculo)}</strong>.` : ""}
        <br><br>Antes de comprar, confirmá que el envase indique todas las especificaciones requeridas.
      `;
    });

    function escaparHTML(texto) {
      const elemento = document.createElement("div");
      elemento.textContent = texto;
      return elemento.innerHTML;
    }
  </script>
</body>
</html>
