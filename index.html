<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Técnica por VIN — Lubricentro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #263349;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --green: #10b981;
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --nishimoto: #fbbf24;
      --nishimoto-bg: rgba(251, 191, 36, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 900;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .brand h1 { font-size: 1.12rem; font-weight: 800; }
    .brand p { font-size: 0.78rem; color: var(--muted); }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 800; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .panel-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vin-box { display: flex; gap: 10px; flex-wrap: wrap; }

    .vin-input {
      flex: 1;
      min-width: 240px;
      background: #0b1120;
      border: 2px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 1.08rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .vin-input:focus { outline: none; border-color: var(--accent); }

    .vin-counter {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .online-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #0b1120;
      border: 1px solid var(--blue);
      display: none;
    }

    .online-box.show { display: block; }
    .online-box.error {
      border-color: rgba(239, 68, 68, 0.7);
      background: var(--red-bg);
    }

    .online-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .online-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .online-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .online-item .k { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); font-weight: 800; }
    .online-item .v { font-size: 0.94rem; font-weight: 700; margin-top: 3px; color: var(--text); }
    .online-item .v.empty { color: #fca5a5; font-style: italic; }

    .ficha-banner-top {
      background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px 12px 0 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ficha-banner-top h2 { font-size: 1.15rem; font-weight: 900; text-transform: uppercase; }

    .ficha-body {
      background: #0b1120;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 18px;
    }

    .dominio-bar {
      text-align: center;
      font-size: 1.02rem;
      font-weight: 800;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .meta-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    @media (max-width: 720px) { .meta-two-col { grid-template-columns: 1fr; } }

    .meta-line { margin-bottom: 10px; }
    .meta-label { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--accent); }
    .meta-val { font-size: 0.98rem; font-weight: 700; word-break: break-word; }

    .sub-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .sub-card-title {
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .kv-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 8px;
      padding: 5px 0;
      font-size: 0.92rem;
    }

    @media (max-width: 560px) { .kv-row { grid-template-columns: 1fr; gap: 2px; } }

    .kv-key { font-weight: 800; color: var(--muted); text-transform: uppercase; font-size: 0.78rem; }
    .kv-val { font-weight: 700; }
    .kv-val.no-usar { color: #fca5a5; }

    .fisica-list { list-style: none; font-size: 0.92rem; }
    .fisica-list li { padding: 4px 0; font-weight: 600; }

    .brands-list { display: flex; flex-direction: column; gap: 8px; }
    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b1120;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .brand-row.nishimoto { background: var(--nishimoto-bg); border: 1.5px solid var(--nishimoto); }
    .brand-name { font-weight: 800; min-width: 125px; }
    .brand-row.nishimoto .brand-name { color: var(--nishimoto); }
    .brand-prod { font-weight: 600; text-align: right; }

    .alerta-roja {
      background: rgba(239, 68, 68, 0.14);
      border: 1.5px solid #ef4444;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 12px;
      color: #fecaca;
      font-size: 0.9rem;
    }
    .alerta-roja strong { color: #fca5a5; display: block; margin-bottom: 4px; }

    .field label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    input[type="text"], textarea {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-badge">VIN</div>
      <div>
        <h1>CONSULTA TÉCNICA POR VIN — LUBRICENTRO</h1>
        <p>Solo búsqueda por VIN (17 caracteres) · Sin datos inventados</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-primary" id="btnNuevoVin" onclick="abrirModal({})">+ Cargar Ficha VIN</button>
      <button id="btnExportar" onclick="exportarJson()">⬇ Exportar JSON</button>
      <button id="btnImportar" onclick="document.getElementById('fileImport').click()">⬆ Importar JSON</button>
      <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarJson(event)" />
    </div>
  </div>
</header>

<div class="container">

  <div class="panel">
    <div class="panel-title">
      <span>🔍 Ingresá el Número de VIN / Chasis (17 caracteres)</span>
      <button class="btn-sm" id="btnLimpiar" onclick="limpiarPantalla()">Limpiar</button>
    </div>

    <div class="vin-box">
      <input
        type="text"
        id="inputVin"
        class="vin-input"
        maxlength="17"
        placeholder="EJ: 93HFA16808Z501002"
        oninput="actualizarContador()"
        onchange="actualizarContador()"
        onkeyup="actualizarContador()"
        onkeydown="if(event.key==='Enter'){ event.preventDefault(); buscarPorVin(); }"
      />
      <button class="btn-primary" id="btnBuscarVin" onclick="buscarPorVin()">CONSULTAR VIN</button>
    </div>

    <div class="vin-counter">
      <span id="contadorChars">0 / 17 caracteres</span>
      <span>Fichas VIN guardadas en tu base: <strong id="totalGuardados">0</strong></span>
    </div>

    <div class="online-box" id="onlineBox">
      <div class="online-header">
        <span id="onlineTitulo" style="font-size:0.92rem; font-weight:800; color:var(--blue);"></span>
        <button class="btn-sm btn-blue" id="btnGuardarDesdeOnline" style="display:none;" onclick="abrirModal(datosOnlineActuales || {})">➕ Guardar ficha para este VIN</button>
      </div>
      <div id="onlineDetalle"></div>
    </div>
  </div>

  <div id="vistaFicha"></div>

</div>

<div class="modal-backdrop" id="modalFicha">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo" style="font-size:1.08rem;">Ficha Técnica por VIN</h2>
      <button class="btn-sm" onclick="cerrarModal()">✕ Cerrar</button>
    </div>

    <input type="hidden" id="editId" />

    <div class="form-grid">
      <div class="field"><label>VIN / Chasis (17 caracteres) *</label><input type="text" id="fVin" maxlength="17" /></div>
      <div class="field"><label>Dominio / Patente</label><input type="text" id="fDominio" /></div>
      <div class="field"><label>Marca *</label><input type="text" id="fMarca" /></div>
      <div class="field"><label>Modelo *</label><input type="text" id="fModelo" /></div>
      <div class="field"><label>Código Chasis</label><input type="text" id="fCodigo" /></div>
      <div class="field"><label>Año / Dígito</label><input type="text" id="fAnio" /></div>
      <div class="field"><label>Origen</label><input type="text" id="fOrigen" /></div>
      <div class="field"><label>Motor</label><input type="text" id="fVersion" /></div>
      <div class="field"><label>Potencia</label><input type="text" id="fPotencia" /></div>
      <div class="field"><label>Torque</label><input type="text" id="fTorque" /></div>
      <div class="field"><label>Caja / Transmisión (vacía si no está confirmada)</label><input type="text" id="fCaja" /></div>
      <div class="field"><label>Tracción</label><input type="text" id="fTraccion" /></div>
      <div class="field"><label>Fluido Específico / Norma</label><input type="text" id="fNorma" /></div>
      <div class="field"><label>Cárter (Litros)</label><input type="text" id="fCarter" /></div>
      <div class="field"><label>Total / Diálisis (Litros)</label><input type="text" id="fDialisis" /></div>
      <div class="field"><label>NO USAR (Fluidos prohibidos)</label><input type="text" id="fNoUsar" /></div>
      <div class="field"><label>Identificación Física 1</label><input type="text" id="fFis1" /></div>
      <div class="field"><label>Identificación Física 2</label><input type="text" id="fFis2" /></div>
      <div class="field"><label>Identificación Física 3</label><input type="text" id="fFis3" /></div>
      <div class="field"><label>Identificación Física 4</label><input type="text" id="fFis4" /></div>
      <div class="field"><label>⭐ NISHIMOTO</label><input type="text" id="fNishimoto" /></div>
      <div class="field"><label>Valvoline</label><input type="text" id="fValvoline" /></div>
      <div class="field"><label>Liqui Moly</label><input type="text" id="fLiquiMoly" /></div>
      <div class="field"><label>Mannol</label><input type="text" id="fMannol" /></div>
      <div class="field"><label>Motul</label><input type="text" id="fMotul" /></div>
    </div>

    <div class="field" style="margin-top:12px;">
      <label>⚠️ Alerta Importante</label>
      <textarea id="fAlerta" rows="2"></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
      <button onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarModal()">💾 GUARDAR FICHA</button>
    </div>
  </div>
</div>

<script>
const BASE_INICIAL = [
  {
    id: "vin-93HFA16808Z501002",
    vin: "93HFA16808Z501002",
    dominio: "GRR030",
    marca: "Honda",
    modelo: "Civic EXS Sedan 4 Ptas A/T",
    codigo: "FA1 - FA168",
    anio: "2008 - Dígito 8",
    origen: "Brasil - Sumare",
    version: "R18A18501020 - R18A1 1.8 i-VTEC 16V",
    potencia: "140 cv @ 6300",
    torque: "17.7 kgm @ 4300",
    caja: "S5A 5 velocidades - Automática secuencial",
    traccion: "Delantera",
    norma: "Honda ATF DW-1 (reemplaza ATF Z1) 08200-9002",
    carter: "3.2 - 3.5 Lts",
    dialisisLitros: "6.1 - 6.5 Lts Diálisis",
    noUsar: "Dexron / CVT / ATF WS / Dual Clutch",
    fisica: [
      "1. Palanca: P-R-N-D-D3-2-1 con S y levas",
      "2. Varilla: Amarilla - lado caja",
      "3. Filtro: Interno no cambiable sin desarme",
      "4. Tapón: 18x1.5"
    ],
    alerta: "IMPORTANTE: Civic 8va Gen 1.8 A/T = ATF DW-1 (Z1). No lleva CVT ni Dexron. Lleva Honda DW-1 específico. El Dexron hace que patine y patee.",
    nishimoto: "Verificar norma exacta DW-1 / Z1 antes de aplicar",
    valvoline: "Valvoline MaxLife ATF (verificar compatibilidad DW-1)",
    liquiMoly: "Liqui Moly Top Tec ATF 1800",
    mannol: "Mannol ATF DW-1",
    motul: "Motul ATF VI"
  }
];

const STORAGE_KEY = "lubricentro_vin_github_v5";
let baseDatos = [];
let datosOnlineActuales = null;

function limpiarVin(str) {
  return String(str || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function cargarBase() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    baseDatos = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(BASE_INICIAL));
    if (!Array.isArray(baseDatos)) baseDatos = JSON.parse(JSON.stringify(BASE_INICIAL));
  } catch (e) {
    baseDatos = JSON.parse(JSON.stringify(BASE_INICIAL));
  }
  const elTotal = document.getElementById("totalGuardados");
  if (elTotal) elTotal.textContent = String(baseDatos.length);
}

function guardarBase() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(baseDatos));
  } catch (e) {}
  const elTotal = document.getElementById("totalGuardados");
  if (elTotal) elTotal.textContent = String(baseDatos.length);
}

function actualizarContador() {
  const input = document.getElementById("inputVin");
  if (!input) return;
  const v = limpiarVin(input.value).slice(0, 17);
  input.value = v;
  const elCont = document.getElementById("contadorChars");
  if (elCont) elCont.textContent = `${v.length} / 17 caracteres`;
}

function limpiarPantalla() {
  const input = document.getElementById("inputVin");
  if (input) input.value = "";
  const elCont = document.getElementById("contadorChars");
  if (elCont) elCont.textContent = "0 / 17 caracteres";
  const box = document.getElementById("onlineBox");
  if (box) box.className = "online-box";
  const det = document.getElementById("onlineDetalle");
  if (det) det.innerHTML = "";
  const btn = document.getElementById("btnGuardarDesdeOnline");
  if (btn) btn.style.display = "none";
  const ficha = document.getElementById("vistaFicha");
  if (ficha) ficha.innerHTML = "";
  datosOnlineActuales = null;
}

async function buscarPorVin() {
  if (!Array.isArray(baseDatos) || baseDatos.length === 0) {
    cargarBase();
  }

  const input = document.getElementById("inputVin");
  const vin = limpiarVin(input ? input.value : "").slice(0, 17);
  if (input) input.value = vin;
  const elCont = document.getElementById("contadorChars");
  if (elCont) elCont.textContent = `${vin.length} / 17 caracteres`;

  const box = document.getElementById("onlineBox");
  const titulo = document.getElementById("onlineTitulo");
  const detalle = document.getElementById("onlineDetalle");
  const btnGuardar = document.getElementById("btnGuardarDesdeOnline");
  const vistaFicha = document.getElementById("vistaFicha");

  datosOnlineActuales = null;
  if (vistaFicha) vistaFicha.innerHTML = "";

  if (vin.length !== 17) {
    if (box) box.className = "online-box show error";
    if (btnGuardar) btnGuardar.style.display = "none";
    if (titulo) titulo.textContent = "⚠️ El VIN debe tener 17 caracteres";
    if (detalle) detalle.innerHTML = `<p style="font-size:0.86rem;">Detectados: ${vin.length} caracteres (${vin || "vacío"}). Verificá que el número completo esté en el campo.</p>`;
    return;
  }

  // 1) Coincidencia exacta en tu base local
  const local = baseDatos.find(item => limpiarVin(item.vin) === vin);
  if (local) {
    if (box) box.className = "online-box";
    renderizarFicha(local);
    return;
  }

  // 2) Consulta online si no está en la base local
  if (box) box.className = "online-box show";
  if (btnGuardar) btnGuardar.style.display = "none";
  if (titulo) titulo.textContent = `🌐 Consultando VIN ${vin} online...`;
  if (detalle) detalle.innerHTML = `<p style="font-size:0.86rem; color:var(--muted);">Consultando servicio de decodificación...</p>`;

  try {
    const url = `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();
    const r = (json && json.Results && json.Results[0]) ? json.Results[0] : {};

    const errorCodes = String(r.ErrorCode || "").split(",").map(s => s.trim()).filter(Boolean);
    const decodificacionValida = errorCodes.includes("0");

    const marca = decodificacionValida ? String(r.Make || "").trim() : "";
    const modelo = decodificacionValida ? String(r.Model || "").trim() : "";
    const anio = decodificacionValida ? String(r.ModelYear || "").trim() : "";
    const origen = decodificacionValida
      ? [r.PlantCity, r.PlantCountry].map(s => String(s || "").trim()).filter(Boolean).join(" · ")
      : "";
    const motor = decodificacionValida
      ? [
          String(r.EngineModel || "").trim(),
          String(r.DisplacementL || "").trim() ? `${String(r.DisplacementL || "").trim()}L` : "",
          String(r.EngineHP || "").trim() ? `${String(r.EngineHP || "").trim()} HP` : ""
        ].filter(Boolean).join(" · ")
      : "";
    // Nunca inventar caja: queda vacía si la API no la informa
    const caja = decodificacionValida ? String(r.TransmissionStyle || "").trim() : "";

    datosOnlineActuales = { vin, marca, modelo, anio, origen, version: motor, caja };
    if (btnGuardar) btnGuardar.style.display = "inline-flex";

    if (!decodificacionValida || (!marca && !modelo && !anio && !motor)) {
      if (box) box.className = "online-box show error";
      if (titulo) titulo.textContent = `⚠️ VIN ${vin}: sin datos confirmados en la consulta online`;
      if (detalle) {
        detalle.innerHTML = `
          <p style="font-size:0.88rem;">Este VIN no figura decodificado con certeza en la API pública (habitual en patentes/chasis Mercosur). <strong>No se muestra ningún auto al azar ni se inventa caja.</strong> Podés tocar <em>"+ Guardar ficha para este VIN"</em> para cargarlo una vez que lo verifiques.</p>
        `;
      }
      return;
    }

    if (box) box.className = "online-box show";
    if (titulo) titulo.textContent = `🌐 Datos devueltos por la API para VIN ${vin}`;
    const celda = (k, v, esCaja = false) => `
      <div class="online-item">
        <div class="k">${k}</div>
        <div class="v ${v ? "" : "empty"}">${v || (esCaja ? "No informada (no se inventa caja)" : "No informado")}</div>
      </div>
    `;

    if (detalle) {
      detalle.innerHTML = `
        <div class="online-grid">
          ${celda("Marca", marca)}
          ${celda("Modelo", modelo)}
          ${celda("Año", anio)}
          ${celda("Motor", motor)}
          ${celda("Origen", origen)}
          ${celda("Caja / Transmisión", caja, true)}
        </div>
        ${!caja ? `<p style="font-size:0.84rem; color:#fca5a5; margin-top:10px; font-weight:700;">⚠️ La API no devolvió caja: no se asigna caja ni fluido automáticamente.</p>` : ""}
      `;
    }
  } catch (err) {
    datosOnlineActuales = { vin };
    if (box) box.className = "online-box show error";
    if (btnGuardar) btnGuardar.style.display = "inline-flex";
    if (titulo) titulo.textContent = `⚠️ Error al consultar VIN ${vin} online`;
    if (detalle) detalle.innerHTML = `<p style="font-size:0.86rem;">No se pudo consultar el servicio online (${err.message}).</p>`;
  }
}

  const p = precarga || {};
  document.getElementById("editId").value = p.id || "";
  document.getElementById("fVin").value = p.vin || "";
  document.getElementById("fDominio").value = p.dominio || "";
  document.getElementById("fMarca").value = p.marca || "";
  document.getElementById("fModelo").value = p.modelo || "";
  document.getElementById("fCodigo").value = p.codigo || "";
  document.getElementById("fAnio").value = p.anio || "";
  document.getElementById("fOrigen").value = p.origen || "";
  document.getElementById("fVersion").value = p.version || "";
  document.getElementById("fPotencia").value = p.potencia || "";
  document.getElementById("fTorque").value = p.torque || "";
  document.getElementById("fCaja").value = p.caja || "";
  document.getElementById("fTraccion").value = p.traccion || "";
  document.getElementById("fNorma").value = p.norma || "";
  document.getElementById("fCarter").value = p.carter || "";
  document.getElementById("fDialisis").value = p.dialisisLitros || "";
  document.getElementById("fNoUsar").value = p.noUsar || "";
  const f = p.fisica || [];
  document.getElementById("fFis1").value = f[0] || "";
  document.getElementById("fFis2").value = f[1] || "";
  document.getElementById("fFis3").value = f[2] || "";
  document.getElementById("fFis4").value = f[3] || "";
  document.getElementById("fNishimoto").value = p.nishimoto || "";
  document.getElementById("fValvoline").value = p.valvoline || "";
  document.getElementById("fLiquiMoly").value = p.liquiMoly || "";
  document.getElementById("fMannol").value = p.mannol || "";
  document.getElementById("fMotul").value = p.motul || "";
  document.getElementById("fAlerta").value = p.alerta || "";
  document.getElementById("modalFicha").classList.add("open");
}

function cerrarModal() {
  document.getElementById("modalFicha").classList.remove("open");
}

function guardarModal() {
  const editId = document.getElementById("editId").value;
  const vin = limpiarVin(document.getElementById("fVin").value).slice(0, 17);
  const marca = document.getElementById("fMarca").value.trim();
  const modelo = document.getElementById("fModelo").value.trim();

  if (vin.length !== 17 || !marca || !modelo) {
    alert("Completá el VIN de 17 caracteres, Marca y Modelo.");
    return;
  }

  const obj = {
    id: editId || ("vin-" + vin),
    vin,
    dominio: document.getElementById("fDominio").value.trim().toUpperCase(),
    marca,
    modelo,
    codigo: document.getElementById("fCodigo").value.trim(),
    anio: document.getElementById("fAnio").value.trim(),
    origen: document.getElementById("fOrigen").value.trim(),
    version: document.getElementById("fVersion").value.trim(),
    potencia: document.getElementById("fPotencia").value.trim(),
    torque: document.getElementById("fTorque").value.trim(),
    caja: document.getElementById("fCaja").value.trim(),
    traccion: document.getElementById("fTraccion").value.trim(),
    norma: document.getElementById("fNorma").value.trim(),
    carter: document.getElementById("fCarter").value.trim(),
    dialisisLitros: document.getElementById("fDialisis").value.trim(),
    noUsar: document.getElementById("fNoUsar").value.trim(),
    fisica: [
      document.getElementById("fFis1").value.trim(),
      document.getElementById("fFis2").value.trim(),
      document.getElementById("fFis3").value.trim(),
      document.getElementById("fFis4").value.trim()
    ].filter(Boolean),
    nishimoto: document.getElementById("fNishimoto").value.trim(),
    valvoline: document.getElementById("fValvoline").value.trim(),
    liquiMoly: document.getElementById("fLiquiMoly").value.trim(),
    mannol: document.getElementById("fMannol").value.trim(),
    motul: document.getElementById("fMotul").value.trim(),
    alerta: document.getElementById("fAlerta").value.trim()
  };

  const idx = baseDatos.findIndex(i => i.id === obj.id || limpiarVin(i.vin) === vin);
  if (idx !== -1) baseDatos[idx] = obj;
  else baseDatos.unshift(obj);

  guardarBase();
  cerrarModal();
  document.getElementById("onlineBox").className = "online-box";
  document.getElementById("inputVin").value = vin;
  document.getElementById("contadorChars").textContent = "17 / 17 caracteres";
  renderizarFicha(obj);
}

function exportarJson() {
  const a = document.createElement("a");
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(baseDatos, null, 2));
  a.download = "fichas-vin-lubricentro.json";
  a.click();
}

function importarJson(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const json = JSON.parse(e.target.result);
      if (Array.isArray(json)) {
        baseDatos = json;
        guardarBase();
        alert(`Base importada (${json.length} fichas).`);
      }
    } catch (err) {
      alert("JSON inválido.");
    }
  };
  reader.readAsText(file);
}

cargarBase();
actualizarContador();
