<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruce VIN Online — Lubricentro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #263349;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.14);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --nishimoto: #fbbf24;
      --nishimoto-bg: rgba(251, 191, 36, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 900;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .brand h1 { font-size: 1.1rem; font-weight: 800; }
    .brand p { font-size: 0.78rem; color: var(--muted); }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card-alt);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 800; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

    .container { max-width: 1020px; margin: 24px auto; padding: 0 16px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vin-box { display: flex; gap: 10px; flex-wrap: wrap; }

    .vin-input {
      flex: 1;
      min-width: 240px;
      background: #0b1120;
      border: 2px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 1.08rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .vin-input:focus { outline: none; border-color: var(--accent); }

    .vin-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cruce-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #0b1120;
      border: 1px solid var(--blue);
      display: none;
    }

    .cruce-box.show { display: block; }

    .cruce-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .cruce-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      margin-top: 8px;
    }

    .cruce-table th, .cruce-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .cruce-table th {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .badge-ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    .badge-warn { background: var(--red-bg); color: #fca5a5; border: 1px solid var(--red); }
    .badge-diff { background: rgba(245, 158, 11, 0.16); color: var(--accent); border: 1px solid var(--accent); }

    .fuentes-estado {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.78rem;
    }

    .ficha-banner-top {
      background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px 12px 0 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ficha-banner-top h2 { font-size: 1.15rem; font-weight: 900; text-transform: uppercase; }

    .ficha-body {
      background: #0b1120;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 18px;
    }

    .dominio-bar {
      text-align: center;
      font-size: 1.02rem;
      font-weight: 800;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .meta-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    @media (max-width: 720px) { .meta-two-col { grid-template-columns: 1fr; } }

    .meta-line { margin-bottom: 10px; }
    .meta-label { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--accent); }
    .meta-val { font-size: 0.98rem; font-weight: 700; word-break: break-word; }

    .sub-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .sub-card-title {
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .kv-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 8px;
      padding: 5px 0;
      font-size: 0.92rem;
    }

    @media (max-width: 560px) { .kv-row { grid-template-columns: 1fr; gap: 2px; } }

    .kv-key { font-weight: 800; color: var(--muted); text-transform: uppercase; font-size: 0.78rem; }
    .kv-val { font-weight: 700; }
    .kv-val.no-usar { color: #fca5a5; }

    .fisica-list { list-style: none; font-size: 0.92rem; }
    .fisica-list li { padding: 4px 0; font-weight: 600; }

    .brands-list { display: flex; flex-direction: column; gap: 8px; }
    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b1120;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .brand-row.nishimoto { background: var(--nishimoto-bg); border: 1.5px solid var(--nishimoto); }
    .brand-name { font-weight: 800; min-width: 125px; }
    .brand-row.nishimoto .brand-name { color: var(--nishimoto); }
    .brand-prod { font-weight: 600; text-align: right; }

    .alerta-roja {
      background: rgba(239, 68, 68, 0.14);
      border: 1.5px solid #ef4444;
      border-radius: 10px;
      padding: 12px 15px;
      margin-top: 12px;
      color: #fecaca;
      font-size: 0.9rem;
    }
    .alerta-roja strong { color: #fca5a5; display: block; margin-bottom: 4px; }

    .field label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    input[type="text"], textarea {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-badge">VIN</div>
      <div>
        <h1>CRUCE VIN ONLINE — LUBRICENTRO</h1>
        <p>Consulta en paralelo por internet y cruza datos entre fuentes · Sin inventar caja</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-primary" onclick="abrirModal({})">+ Cargar Ficha VIN</button>
      <button onclick="exportarJson()">⬇ Exportar JSON</button>
      <button onclick="document.getElementById('fileImport').click()">⬆ Importar JSON</button>
      <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarJson(event)" />
    </div>
  </div>
</header>

<div class="container">

  <div class="panel">
    <div class="panel-title">
      <span>🔍 Número de VIN / Chasis (17 caracteres) — Cruce Online</span>
      <button class="btn-sm" onclick="limpiarPantalla()">Limpiar</button>
    </div>

    <div class="vin-box">
      <input
        type="text"
        id="inputVin"
        class="vin-input"
        maxlength="17"
        placeholder="EJ: 93HFA16808Z501002"
        oninput="actualizarContador()"
        onchange="actualizarContador()"
        onkeyup="actualizarContador()"
        onkeydown="if(event.key==='Enter'){ event.preventDefault(); buscarPorVin(); }"
      />
      <button class="btn-primary" onclick="buscarPorVin()">CRUZAR VIN ONLINE</button>
    </div>

    <div class="vin-meta">
      <span id="contadorChars">0 / 17 caracteres</span>
      <span>Fichas guardadas: <strong id="totalGuardados">0</strong></span>
    </div>

    <div class="cruce-box" id="cruceBox">
      <div class="cruce-header">
        <span id="cruceTitulo" style="font-size:0.92rem; font-weight:800; color:var(--blue);"></span>
        <button class="btn-sm btn-blue" id="btnGuardarDesdeCruce" style="display:none;" onclick="abrirModal(borradorCruce || {})">➕ Cargar ficha con lo confirmado</button>
      </div>
      <div class="fuentes-estado" id="fuentesEstado"></div>
      <div id="cruceTablaWrap"></div>
    </div>
  </div>

  <div id="vistaFicha"></div>

</div>

<div class="modal-backdrop" id="modalFicha">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo" style="font-size:1.08rem;">Ficha Técnica por VIN</h2>
      <button class="btn-sm" onclick="cerrarModal()">✕ Cerrar</button>
    </div>

    <input type="hidden" id="editId" />

    <div class="form-grid">
      <div class="field"><label>VIN / Chasis (17 caracteres) *</label><input type="text" id="fVin" maxlength="17" /></div>
      <div class="field"><label>Dominio / Patente</label><input type="text" id="fDominio" /></div>
      <div class="field"><label>Marca *</label><input type="text" id="fMarca" /></div>
      <div class="field"><label>Modelo *</label><input type="text" id="fModelo" /></div>
      <div class="field"><label>Código Chasis</label><input type="text" id="fCodigo" /></div>
      <div class="field"><label>Año / Dígito</label><input type="text" id="fAnio" /></div>
      <div class="field"><label>Origen</label><input type="text" id="fOrigen" /></div>
      <div class="field"><label>Motor</label><input type="text" id="fVersion" /></div>
      <div class="field"><label>Potencia</label><input type="text" id="fPotencia" /></div>
      <div class="field"><label>Torque</label><input type="text" id="fTorque" /></div>
      <div class="field"><label>Caja / Transmisión (vacía si no está confirmada)</label><input type="text" id="fCaja" /></div>
      <div class="field"><label>Tracción</label><input type="text" id="fTraccion" /></div>
      <div class="field"><label>Fluido Específico / Norma</label><input type="text" id="fNorma" /></div>
      <div class="field"><label>Cárter (Litros)</label><input type="text" id="fCarter" /></div>
      <div class="field"><label>Total / Diálisis (Litros)</label><input type="text" id="fDialisis" /></div>
      <div class="field"><label>NO USAR (Fluidos prohibidos)</label><input type="text" id="fNoUsar" /></div>
      <div class="field"><label>Identificación Física 1</label><input type="text" id="fFis1" /></div>
      <div class="field"><label>Identificación Física 2</label><input type="text" id="fFis2" /></div>
      <div class="field"><label>Identificación Física 3</label><input type="text" id="fFis3" /></div>
      <div class="field"><label>Identificación Física 4</label><input type="text" id="fFis4" /></div>
      <div class="field"><label>⭐ NISHIMOTO</label><input type="text" id="fNishimoto" /></div>
      <div class="field"><label>Valvoline</label><input type="text" id="fValvoline" /></div>
      <div class="field"><label>Liqui Moly</label><input type="text" id="fLiquiMoly" /></div>
      <div class="field"><label>Mannol</label><input type="text" id="fMannol" /></div>
      <div class="field"><label>Motul</label><input type="text" id="fMotul" /></div>
    </div>

    <div class="field" style="margin-top:12px;">
      <label>⚠️ Alerta Importante</label>
      <textarea id="fAlerta" rows="2"></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
      <button onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarModal()">💾 GUARDAR FICHA</button>
    </div>
  </div>
</div>

<script>
const BASE_INICIAL = [
  {
    id: "vin-93HFA16808Z501002",
    vin: "93HFA16808Z501002",
    dominio: "GRR030",
    marca: "Honda",
    modelo: "Civic EXS Sedan 4 Ptas A/T",
    codigo: "FA1 - FA168",
    anio: "2008 - Dígito 8",
    origen: "Brasil - Sumare",
    version: "R18A18501020 - R18A1 1.8 i-VTEC 16V",
    potencia: "140 cv @ 6300",
    torque: "17.7 kgm @ 4300",
    caja: "S5A 5 velocidades - Automática secuencial",
    traccion: "Delantera",
    norma: "Honda ATF DW-1 (reemplaza ATF Z1) 08200-9002",
    carter: "3.2 - 3.5 Lts",
    dialisisLitros: "6.1 - 6.5 Lts Diálisis",
    noUsar: "Dexron / CVT / ATF WS / Dual Clutch",
    fisica: [
      "1. Palanca: P-R-N-D-D3-2-1 con S y levas",
      "2. Varilla: Amarilla - lado caja",
      "3. Filtro: Interno no cambiable sin desarme",
      "4. Tapón: 18x1.5"
    ],
    alerta: "IMPORTANTE: Civic 8va Gen 1.8 A/T = ATF DW-1 (Z1). No lleva CVT ni Dexron. Lleva Honda DW-1 específico. El Dexron hace que patine y patee.",
    nishimoto: "Verificar norma exacta DW-1 / Z1 antes de aplicar",
    valvoline: "Valvoline MaxLife ATF (verificar compatibilidad DW-1)",
    liquiMoly: "Liqui Moly Top Tec ATF 1800",
    mannol: "Mannol ATF DW-1",
    motul: "Motul ATF VI"
  }
];

const STORAGE_KEY = "lubricentro_vin_cruce_v6";
let baseDatos = [];
let borradorCruce = null;

function limpiarVin(str) {
  return String(str || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function cargarBase() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    baseDatos = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(BASE_INICIAL));
    if (!Array.isArray(baseDatos)) baseDatos = JSON.parse(JSON.stringify(BASE_INICIAL));
  } catch (e) {
    baseDatos = JSON.parse(JSON.stringify(BASE_INICIAL));
  }
  const el = document.getElementById("totalGuardados");
  if (el) el.textContent = String(baseDatos.length);
}

function guardarBase() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(baseDatos));
  } catch (e) {}
  const el = document.getElementById("totalGuardados");
  if (el) el.textContent = String(baseDatos.length);
}

function actualizarContador() {
  const input = document.getElementById("inputVin");
  if (!input) return;
  const v = limpiarVin(input.value).slice(0, 17);
  input.value = v;
  const el = document.getElementById("contadorChars");
  if (el) el.textContent = `${v.length} / 17 caracteres`;
}

function limpiarPantalla() {
  const input = document.getElementById("inputVin");
  if (input) input.value = "";
  const el = document.getElementById("contadorChars");
  if (el) el.textContent = "0 / 17 caracteres";
  const box = document.getElementById("cruceBox");
  if (box) box.className = "cruce-box";
  const est = document.getElementById("fuentesEstado");
  if (est) est.innerHTML = "";
  const wrap = document.getElementById("cruceTablaWrap");
  if (wrap) wrap.innerHTML = "";
  const btn = document.getElementById("btnGuardarDesdeCruce");
  if (btn) btn.style.display = "none";
  const ficha = document.getElementById("vistaFicha");
  if (ficha) ficha.innerHTML = "";
  borradorCruce = null;
}

function extraerCamposNhtsa(r, nombreFuente) {
  const errorCodes = String(r.ErrorCode || "").split(",").map(s => s.trim()).filter(Boolean);
  const decodValida = errorCodes.includes("0");
  return {
    fuente: nombreFuente,
    ok: true,
    decodValida,
    marca: decodValida ? String(r.Make || "").trim() : "",
    modelo: decodValida ? String(r.Model || "").trim() : "",
    anio: decodValida ? String(r.ModelYear || "").trim() : "",
    origen: decodValida
      ? [r.PlantCity, r.PlantCountry].map(s => String(s || "").trim()).filter(Boolean).join(" · ")
      : "",
    motor: decodValida
      ? [
          String(r.EngineModel || "").trim(),
          String(r.DisplacementL || "").trim() ? `${String(r.DisplacementL || "").trim()}L` : "",
          String(r.EngineHP || "").trim() ? `${String(r.EngineHP || "").trim()} HP` : ""
        ].filter(Boolean).join(" · ")
      : "",
    // Nunca inventar caja: queda vacía si la fuente no la informa
    caja: decodValida ? String(r.TransmissionStyle || "").trim() : ""
  };
}

async function consultarFuenteValues(vin) {
  const url = `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${encodeURIComponent(vin)}?format=json`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const json = await resp.json();
  const r = (json && json.Results && json.Results[0]) ? json.Results[0] : {};
  return extraerCamposNhtsa(r, "NHTSA DecodeVinValues");
}

async function consultarFuenteExtended(vin) {
  const url = `https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/${encodeURIComponent(vin)}?format=json`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const json = await resp.json();
  const r = (json && json.Results && json.Results[0]) ? json.Results[0] : {};
  const base = extraerCamposNhtsa(r, "NHTSA Extended");
  // Si Extended trae TransmissionType adicional cuando TransmissionStyle viene vacío, lo toma; si no, vacío
  if (!base.caja && base.decodValida && String(r.TransmissionType || "").trim()) {
    base.caja = String(r.TransmissionType || "").trim();
  }
  return base;
}

function cruzarResultados(resultados, fichaGuardada) {
  const campos = [
    { key: "marca", label: "Marca" },
    { key: "modelo", label: "Modelo" },
    { key: "anio", label: "Año" },
    { key: "motor", label: "Motor" },
    { key: "origen", label: "Origen" },
    { key: "caja", label: "Caja / Transmisión", esCaja: true }
  ];

  const filas = campos.map(c => {
    const valoresPorFuente = resultados.map(res => ({
      fuente: res.fuente,
      val: res.ok ? (res[c.key] || "") : ""
    }));

    const noVacios = valoresPorFuente.map(x => x.val).filter(Boolean);
    const unicosLower = [...new Set(noVacios.map(v => v.toLowerCase()))];

    let estadoHtml = "";
    let valorConfirmado = "";

    if (noVacios.length === 0) {
      estadoHtml = c.esCaja
        ? `<span class="badge badge-warn">Sin confirmar (no se inventa)</span>`
        : `<span class="badge badge-warn">No devuelto</span>`;
    } else if (unicosLower.length === 1) {
      valorConfirmado = noVacios[0];
      estadoHtml = `<span class="badge badge-ok">Coincide</span>`;
    } else {
      estadoHtml = `<span class="badge badge-diff">Diferencias entre fuentes</span>`;
    }

    const detalleFuentes = valoresPorFuente
      .map(x => `<strong>${x.fuente}:</strong> ${x.val || (c.esCaja ? "<em>No informada</em>" : "<em>Sin dato</em>")}`)
      .join("<br>");

    return {
      key: c.key,
      label: c.label,
      valorConfirmado,
      detalleFuentes,
      estadoHtml
    };
  });

  const confirmadoMap = {};
  filas.forEach(f => {
    confirmadoMap[f.key] = f.valorConfirmado;
  });

  return { filas, confirmadoMap, fichaGuardada };
}

async function buscarPorVin() {
  if (!Array.isArray(baseDatos) || baseDatos.length === 0) cargarBase();

  const input = document.getElementById("inputVin");
  const vin = limpiarVin(input ? input.value : "").slice(0, 17);
  if (input) input.value = vin;
  actualizarContador();

  const box = document.getElementById("cruceBox");
  const titulo = document.getElementById("cruceTitulo");
  const estadoFuentes = document.getElementById("fuentesEstado");
  const tablaWrap = document.getElementById("cruceTablaWrap");
  const btnGuardar = document.getElementById("btnGuardarDesdeCruce");
  const vistaFicha = document.getElementById("vistaFicha");

  borradorCruce = null;
  if (vistaFicha) vistaFicha.innerHTML = "";

  if (vin.length !== 17) {
    if (box) box.className = "cruce-box show";
    if (btnGuardar) btnGuardar.style.display = "none";
    if (titulo) titulo.textContent = "⚠️ Ingresá un VIN de 17 caracteres para cruzar online";
    if (estadoFuentes) estadoFuentes.innerHTML = "";
    if (tablaWrap) tablaWrap.innerHTML = `<p style="font-size:0.86rem; color:#fca5a5;">Cantidad actual: ${vin.length} caracteres.</p>`;
    return;
  }

  const fichaGuardada = baseDatos.find(item => limpiarVin(item.vin) === vin) || null;
  if (fichaGuardada) {
    renderizarFicha(fichaGuardada);
  }

  if (box) box.className = "cruce-box show";
  if (btnGuardar) btnGuardar.style.display = "none";
  if (titulo) titulo.textContent = `🌐 Cruzando VIN ${vin} en fuentes online...`;
  if (estadoFuentes) estadoFuentes.innerHTML = `<span class="badge badge-diff">Consultando fuentes...</span>`;
  if (tablaWrap) tablaWrap.innerHTML = "";

  const promesas = [
    consultarFuenteValues(vin).catch(err => ({ fuente: "NHTSA DecodeVinValues", ok: false, error: err.message })),
    consultarFuenteExtended(vin).catch(err => ({ fuente: "NHTSA Extended", ok: false, error: err.message }))
  ];

  const resultados = await Promise.all(promesas);

  if (estadoFuentes) {
    estadoFuentes.innerHTML = resultados.map(r => {
      if (!r.ok) return `<span class="badge badge-warn">${r.fuente}: Error (${r.error})</span>`;
      if (!r.decodValida) return `<span class="badge badge-warn">${r.fuente}: Sin decodificación válida</span>`;
      return `<span class="badge badge-ok">${r.fuente}: Respondido</span>`;
    }).join("");
  }

  const { filas, confirmadoMap } = cruzarResultados(resultados, fichaGuardada);

  borradorCruce = {
    vin,
    dominio: fichaGuardada ? fichaGuardada.dominio : "",
    marca: confirmadoMap.marca || (fichaGuardada ? fichaGuardada.marca : ""),
    modelo: confirmadoMap.modelo || (fichaGuardada ? fichaGuardada.modelo : ""),
    anio: confirmadoMap.anio || (fichaGuardada ? fichaGuardada.anio : ""),
    version: confirmadoMap.motor || (fichaGuardada ? fichaGuardada.version : ""),
    origen: confirmadoMap.origen || (fichaGuardada ? fichaGuardada.origen : ""),
    // Nunca inventar caja: solo se toma si coincide o si ya estaba en la ficha guardada
    caja: confirmadoMap.caja || (fichaGuardada ? fichaGuardada.caja : "")
  };

  if (btnGuardar) btnGuardar.style.display = "inline-flex";
  if (titulo) {
    titulo.textContent = fichaGuardada
      ? `🌐 Cruce online para VIN ${vin} (comparado con tu ficha guardada)`
      : `🌐 Cruce online para VIN ${vin} (solo datos coincidentes o informados)`;
  }

  if (tablaWrap) {
    tablaWrap.innerHTML = `
      <table class="cruce-table">
        <thead>
          <tr>
            <th>Campo</th>
            <th>Detalle por fuente</th>
            <th>Estado del cruce</th>
          </tr>
        </thead>
        <tbody>
          ${filas.map(f => `
            <tr>
              <td><strong>${f.label}</strong></td>
              <td>${f.detalleFuentes}</td>
              <td>${f.estadoHtml}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
      ${!confirmadoMap.caja ? `<p style="font-size:0.84rem; color:#fca5a5; margin-top:10px; font-weight:700;">⚠️ Ninguna fuente online confirmó el tipo de caja de forma concluyente: no se asigna caja ni fluido automáticamente.</p>` : ""}
    `;
  }
}

    </div>
    <div class="ficha-body">
      <div class="dominio-bar">${item.dominio ? `Dominio: <strong>${item.dominio}</strong> — ` : ""}Consulta Taller</div>

        </div>
        <div>
          <div class="meta-line"><div class="meta-label">Año:</div><div class="meta-val">${item.anio || "-"}</div></div>
          <div class="meta-line"><div class="meta-label">Origen:</div><div class="meta-val">${item.origen || "-"}</div></div>
          <div class="meta-line"><div class="meta-label">Potencia:</div><div class="meta-val">${item.potencia || "-"}</div></div>
          <div class="meta-line"><div class="meta-label">Torque:</div><div class="meta-val">${item.torque || "-"}</div></div>
        </div>
      </div>

      <div class="sub-card">
        <div class="sub-card-title">Transmisión</div>
        <div class="kv-row"><div class="kv-key">Caja:</div><div class="kv-val">${item.caja || "No especificada"}</div></div>
        <div class="kv-row"><div class="kv-key">Tracción:</div><div class="kv-val">${item.traccion || "-"}</div></div>
        <div class="kv-row"><div class="kv-key">Fluido:</div><div class="kv-val" style="color:var(--green);">${item.norma || "-"}</div></div>

        <div class="kv-row"><div class="kv-key">No usar:</div><div class="kv-val no-usar">${item.noUsar || "-"}</div></div>
      </div>

      <div class="sub-card">
        <div class="sub-card-title">Identificación Física</div>
        <ul class="fisica-list">${fisicaHtml || "<li>Sin datos cargados.</li>"}</ul>
      </div>

      <div class="sub-card">
        <div class="sub-card-title">Equivalencias en Marcas Trabajadas</div>
        <div class="brands-list">
          <div class="brand-row nishimoto"><div class="brand-name">⭐ NISHIMOTO</div><div class="brand-prod">${item.nishimoto || "-"}</div></div>
          <div class="brand-row"><div class="brand-name">Valvoline</div><div class="brand-prod">${item.valvoline || "-"}</div></div>
          <div class="brand-row"><div class="brand-name">Liqui Moly</div><div class="brand-prod">${item.liquiMoly || "-"}</div></div>
          <div class="brand-row"><div class="brand-name">Mannol</div><div class="brand-prod">${item.mannol || "-"}</div></div>
          <div class="brand-row"><div class="brand-name">Motul</div><div class="brand-prod">${item.motul || "-"}</div></div>
        </div>
      </div>

      ${item.alerta ? `<div class="alerta-roja"><strong>⚠️ IMPORTANTE</strong>${item.alerta}</div>` : ""}
    </div>
  `;
}

function abrirModal(precarga) {
  const p = precarga || {};
  document.getElementById("editId").value = p.id || "";
  document.getElementById("fVin").value = p.vin || "";
  document.getElementById("fDominio").value = p.dominio || "";
  document.getElementById("fMarca").value = p.marca || "";
  document.getElementById("fModelo").value = p.modelo || "";
  document.getElementById("fCodigo").value = p.codigo || "";
  document.getElementById("fAnio").value = p.anio || "";
  document.getElementById("fOrigen").value = p.origen || "";
  document.getElementById("fVersion").value = p.version || "";
  document.getElementById("fPotencia").value = p.potencia || "";
  document.getElementById("fTorque").value = p.torque || "";
  document.getElementById("fCaja").value = p.caja || "";
  document.getElementById("fTraccion").value = p.traccion || "";
  document.getElementById("fNorma").value = p.norma || "";
  document.getElementById("fCarter").value = p.carter || "";
  document.getElementById("fDialisis").value = p.dialisisLitros || "";
  document.getElementById("fNoUsar").value = p.noUsar || "";
  const f = p.fisica || [];
  document.getElementById("fFis1").value = f[0] || "";
  document.getElementById("fFis2").value = f[1] || "";
  document.getElementById("fFis3").value = f[2] || "";
  document.getElementById("fFis4").value = f[3] || "";
  document.getElementById("fNishimoto").value = p.nishimoto || "";
  document.getElementById("fValvoline").value = p.valvoline || "";
  document.getElementById("fLiquiMoly").value = p.liquiMoly || "";
  document.getElementById("fMannol").value = p.mannol || "";
  document.getElementById("fMotul").value = p.motul || "";
  document.getElementById("fAlerta").value = p.alerta || "";
  document.getElementById("modalFicha").classList.add("open");
}

function cerrarModal() {
  document.getElementById("modalFicha").classList.remove("open");
}

function guardarModal() {
  const editId = document.getElementById("editId").value;
  const vin = limpiarVin(document.getElementById("fVin").value).slice(0, 17);
  const marca = document.getElementById("fMarca").value.trim();
  const modelo = document.getElementById("fModelo").value.trim();

  if (vin.length !== 17 || !marca || !modelo) {
    alert("Completá el VIN de 17 caracteres, Marca y Modelo.");
    return;
  }

  const obj = {
    id: editId || ("vin-" + vin),
    vin,
    dominio: document.getElementById("fDominio").value.trim().toUpperCase(),
    marca,
    modelo,
    codigo: document.getElementById("fCodigo").value.trim(),
    anio: document.getElementById("fAnio").value.trim(),
    origen: document.getElementById("fOrigen").value.trim(),
    version: document.getElementById("fVersion").value.trim(),
    potencia: document.getElementById("fPotencia").value.trim(),
    torque: document.getElementById("fTorque").value.trim(),
    caja: document.getElementById("fCaja").value.trim(),
    traccion: document.getElementById("fTraccion").value.trim(),
    norma: document.getElementById("fNorma").value.trim(),
    carter: document.getElementById("fCarter").value.trim(),
    dialisisLitros: document.getElementById("fDialisis").value.trim(),
    noUsar: document.getElementById("fNoUsar").value.trim(),
    fisica: [
      document.getElementById("fFis1").value.trim(),
      document.getElementById("fFis2").value.trim(),
      document.getElementById("fFis3").value.trim(),
      document.getElementById("fFis4").value.trim()
    ].filter(Boolean),
    nishimoto: document.getElementById("fNishimoto").value.trim(),
    valvoline: document.getElementById("fValvoline").value.trim(),
    liquiMoly: document.getElementById("fLiquiMoly").value.trim(),
    mannol: document.getElementById("fMannol").value.trim(),
    motul: document.getElementById("fMotul").value.trim(),
    alerta: document.getElementById("fAlerta").value.trim()
  };

  const idx = baseDatos.findIndex(i => i.id === obj.id || limpiarVin(i.vin) === vin);
  if (idx !== -1) baseDatos[idx] = obj;
  else baseDatos.unshift(obj);

  guardarBase();
  cerrarModal();
  document.getElementById("inputVin").value = vin;
  actualizarContador();
  renderizarFicha(obj);
}

function exportarJson() {
  const a = document.createElement("a");
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(baseDatos, null, 2));
  a.download = "fichas-vin-lubricentro.json";
  a.click();
}

function importarJson(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const json = JSON.parse(e.target.result);
      if (Array.isArray(json)) {
        baseDatos = json;
        guardarBase();
        alert(`Base importada (${json.length} fichas).`);
      }
    } catch (err) {
      alert("JSON inválido.");
    }
  };
  reader.readAsText(file);
}

cargarBase();
actualizarContador();
</script>
