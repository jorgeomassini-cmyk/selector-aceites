<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador Técnico Universal - Lubricentro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 10px; background: #0f172a; color: #1e293b; font-family: system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; background: #fff; border-radius: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 14px; gap: 6px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.2rem; }
    .top-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    label { display: block; margin: 10px 0 4px; font-weight: 700; font-size: .85rem; }
    input, select, button { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    input.mayus { text-transform: uppercase; font-weight: 700; }
    button { margin-top: 10px; border: 0; background: #1d4ed8; color: #fff; font-weight: 700; cursor: pointer; }
    .btn-sec { background: #475569; width: auto; padding: 8px 11px; margin: 0; font-size: .8rem; }
    .btn-verde { background: #15803d; }
    .btn-wsp { background: #16a34a; margin-top: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media(max-width:600px) { .grid-2 { grid-template-columns: 1fr; } }
    .panel { background: #f8fafc; border: 1px solid #cbd5e1; padding: 14px; border-radius: 10px; }
    #est { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; font-size: .9rem; font-weight: 600; }
    .est-ok { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .est-warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    #res { display: none; margin-top: 18px; padding: 16px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; }
    .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); padding: 14px; overflow-y: auto; z-index: 50; }
    .modal-box { background: #fff; max-width: 600px; margin: 16px auto; padding: 18px; border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🛢️ Mostrador Técnico Universal</h1>
      <div class="top-btns">
        <button type="button" class="btn-sec" onclick="abrirModal()">+ Cargar Ficha</button>
        <button type="button" class="btn-sec" onclick="exportarBase()">⬇ Respaldo</button>
        <button type="button" class="btn-sec" onclick="document.getElementById('imp-file').click()">⬆ Cargar Respaldo</button>
        <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importarBase(event)">
      </div>
    </header>

    <form id="fc" class="panel">
      <label>VIN (17 dígitos nacional o importado) o Patente guardada</label>
      <input id="cod" class="mayus" maxlength="17" placeholder="Ej: WDDGF4JB1BA429719 or 9BWCB05W26T176579" required>
      <button type="submit">Decodificar VIN / Buscar Patente</button>
      <div id="est"></div>
    </form>

    <form id="fm" style="margin-top:14px">
      <div class="grid-2">
        <div><label>Marca</label><select id="m"></select></div>
        <div><label>Modelo</label><select id="mo" disabled></select></div>
        <div><label>Año</label><select id="a" disabled></select></div>
        <div><label>Versión / Caja</label><select id="v" disabled></select></div>
      </div>
      <button type="submit" class="btn-verde">Ver Ficha Técnica</button>
    </form>

    <div id="res"></div>
  </main>

  <div id="mod" class="modal">
    <div class="modal-box">
      <h2>Agendar Patente / Vehículo Nuevo</h2>
      <form id="fg">
        <div class="grid-2">
          <input id="np" class="mayus" placeholder="Patente (ej: AE123BC)">
          <input id="nv" class="mayus" maxlength="17" placeholder="VIN (17 caracteres)">
          <input id="nm" required placeholder="Marca *">
          <input id="nmo" required placeholder="Modelo *">
          <input id="na" type="number" required placeholder="Año *">
          <input id="nve" required placeholder="Versión / Motor *">
          <input id="nmc" placeholder="Cód. Motor">
          <input id="ncj" placeholder="Caja AT (ej: ZF 8HP / CVT)">
          <input id="nma" placeholder="Aceite Motor y Norma">
          <input id="nml" type="number" step="0.1" placeholder="Litros Motor">
          <input id="naa" placeholder="Norma ATF / CVT Caja">
          <input id="nal" type="number" step="0.5" placeholder="Litros Diálisis">
          <input id="nfc" placeholder="Filtro Caja">
          <input id="nfm" placeholder="Filtros Motor">
        </div>
        <button type="submit" class="btn-verde">Guardar Ficha</button>
        <button type="button" class="btn-sec" style="width:100%;margin-top:8px" onclick="document.getElementById('mod').style.display='none'">Cerrar</button>
      </form>
    </div>
  </div>

    const guardados = JSON.parse(localStorage.getItem('ldb_custom_v3')) || [];
    let db = [...base, ...guardados];
    let actual = null;

    const m = document.getElementById('m'), mo = document.getElementById('mo'), a = document.getElementById('a'), v = document.getElementById('v'), res = document.getElementById('res'), est = document.getElementById('est');

    function setEst(txt, tipo = 'ok') {
      if (!txt) { est.style.display = 'none'; return; }
      est.textContent = txt;
      est.className = tipo === 'warn' ? 'est-warn' : 'est-ok';
      est.style.display = 'block';
    }

    function fill(el, arr, txt) {
      el.innerHTML = `<option value="">${txt}</option>`;
      [...new Set(arr)].sort().forEach(x => { const o = document.createElement('option'); o.value = o.textContent = x; el.appendChild(o); });
      el.disabled = !arr.length;
    }
    function init() { fill(m, db.map(x => x.m), 'Seleccionar marca (' + [...new Set(db.map(x=>x.m))].length + ' marcas)...'); }
    init();

    m.onchange = () => { fill(mo, db.filter(x => x.m === m.value).map(x => x.mo), 'Modelo...'); fill(a, [], 'Año...'); fill(v, [], 'Versión...'); };
    mo.onchange = () => { fill(a, db.filter(x => x.m === m.value && x.mo === mo.value).map(x => x.a), 'Año...'); fill(v, [], 'Versión...'); };
    a.onchange = () => { fill(v, db.filter(x => x.m === m.value && x.mo === mo.value && String(x.a) === a.value).map(x => x.ve), 'Versión...'); };

    document.getElementById('fm').onsubmit = e => {
      e.preventDefault(); setEst('');
      const x = db.find(i => i.m === m.value && i.mo === mo.value && String(i.a) === a.value && i.ve === v.value);
      if (x) show(x);
    };

    document.getElementById('fc').onsubmit = async e => {
      e.preventDefault(); setEst('');
      const c = document.getElementById('cod').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const loc = db.find(i => (i.p && i.p.includes(c)) || (i.v && i.v.includes(c)));
      if (loc) { show(loc, c); return; }

      if (c.length === 17) {
        const pref = c.substring(0, 3);
        const fab = WMI[pref] || `Fabricante código "${pref}"`;
        const anioVin = ANIOS_VIN[c.charAt(9)] || 'S/D';
        const marcaBase = fab.split(' ').at(0);

        const optMarca = [...m.options].find(o => o.value.toLowerCase() === marcaBase.toLowerCase());
        if (optMarca) { m.value = optMarca.value; m.onchange(); }

        setEst(`VIN: ${fab} • Año: ${anioVin}. Consultando base internacional...`, 'ok');

        try {
          const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/${c}?format=json`);
          const d = await r.json();
          const info = d.Results && d.Results.at(0);
          if (info && info.Model) {
            const detalle = `${info.Make} ${info.Model} (${info.ModelYear || anioVin}) ${info.DisplacementL ? info.DisplacementL + 'L' : ''}`.trim();
            setEst(`VIN Decodificado: ${detalle}`, 'ok');
            const modLimpio = info.Model.trim().toLowerCase();
            const mt = db.find(i => i.m.toLowerCase() === info.Make.trim().toLowerCase() && (i.mo.toLowerCase().includes(modLimpio) || modLimpio.includes(i.mo.toLowerCase().split(' ').at(0))));
            if (mt) {
              mo.value = mt.mo; mo.onchange();
              show(mt, c);
              return;
            }
            show({
              m: info.Make.trim(), mo: info.Model.trim(), a: info.ModelYear || anioVin,
              ve: `${info.Trim || ''} ${info.DisplacementL ? info.DisplacementL + 'L' : ''}`.trim() || 'Importado (Confirmar versión)',
              mc: info.EngineModel || `${info.EngineCylinders || ''} cil. ${info.FuelTypePrimary || ''}`.trim() || 'S/D',
              cj: info.TransmissionStyle || 'Confirmar caja',
              ma: 'Confirmar norma en catálogo', ml: 5, aa: 'Confirmar norma ATF/CVT', al: 10, fc: 'Confirmar', fm: 'Confirmar'
            }, c);
          } else {
            setEst(`Chasis identificado: ${fab} — Año ${anioVin}. Elegí el modelo de ${marcaBase} abajo o agéndalo con "+ Cargar Ficha".`, 'warn');
          }
        } catch {
          setEst(`Chasis identificado offline: ${fab} — Año ${anioVin}. Elegí el modelo de ${marcaBase} en el selector de abajo.`, 'warn');
        }
      } else {
        setEst(`Patente "${c}" no agendada aún. Tocá "+ Cargar Ficha" arriba para guardarla.`, 'warn');
      }
    };

    function show(x, c = '') {
      actual = x;
      res.innerHTML = `
        <h2>${x.m} ${x.mo} (${x.a}) ${c}</h2>
        <div><b>Versión:</b> ${x.ve} | <b>Motor:</b> ${x.mc} | <b>Caja:</b> ${x.cj}</div>
        <div class="box"><b>Aceite Motor:</b> ${x.ma} (${x.ml}L)<br><b>Filtros Motor:</b> ${x.fm}</div>
        <div class="box"><b>Diálisis Caja AT:</b> ${x.aa} (${x.al}L)<br><b>Filtro Caja:</b> ${x.fc}</div>
        <div class="box">
          <b>Cotizador Rápido</b>
          <div class="grid-2" style="margin-top:8px">
            <input type="number" id="pm" placeholder="$ Litro Motor" oninput="calc(${x.ml},${x.al})">
            <input type="number" id="em" placeholder="$ Filtros + MO Motor" oninput="calc(${x.ml},${x.al})">
            <input type="number" id="pa" placeholder="$ Litro ATF Caja" oninput="calc(${x.ml},${x.al})">
            <input type="number" id="ea" placeholder="$ Filtro + Diálisis" oninput="calc(${x.ml},${x.al})">
          </div>
          <div id="tot" style="font-weight:800;margin-top:10px;color:#14532d">Motor (${x.ml}L): $0 | Diálisis (${x.al}L): $0</div>
          <button type="button" class="btn-wsp" onclick="wsp(${x.ml},${x.al})">📋 Copiar presupuesto para WhatsApp</button>
        </div>`;
      res.style.display = 'block';
    }

    function calc(ml, al) {
      const tm = (ml * (+document.getElementById('pm').value || 0)) + (+document.getElementById('em').value || 0);
      const ta = (al * (+document.getElementById('pa').value || 0)) + (+document.getElementById('ea').value || 0);
      document.getElementById('tot').textContent = `Motor (${ml}L): $${tm.toLocaleString('es-AR')} | Diálisis (${al}L): $${ta.toLocaleString('es-AR')}`;
    }

    function wsp(ml, al) {
      if (!actual) return;
      const tm = (ml * (+document.getElementById('pm').value || 0)) + (+document.getElementById('em').value || 0);
      const ta = (al * (+document.getElementById('pa').value || 0)) + (+document.getElementById('ea').value || 0);
      const txt = `*PRESUPUESTO LUBRICENTRO*\nVehículo: ${actual.m} ${actual.mo} (${actual.a})\n• Service Motor (${ml}L ${actual.ma}): $${tm.toLocaleString('es-AR')}\n• Diálisis Caja AT (${al}L ${actual.aa}): $${ta.toLocaleString('es-AR')}`;
      navigator.clipboard.writeText(txt).then(() => alert('¡Copiado! Pegalo en WhatsApp.'));
    }

    function abrirModal() {
      const codActual = document.getElementById('cod').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      if (codActual.length === 17) {
        document.getElementById('nv').value = codActual;
        const fab = WMI[codActual.substring(0, 3)];
        if (fab) document.getElementById('nm').value = fab.split(' ').at(0);
        if (ANIOS_VIN[codActual.charAt(9)]) document.getElementById('na').value = ANIOS_VIN[codActual.charAt(9)];
      } else if (codActual.length >= 6) {
        document.getElementById('np').value = codActual;
      }
      document.getElementById('mod').style.display = 'block';
    }

    function exportarBase() {
      const blob = new Blob([JSON.stringify(guardados, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'patentes_lubricentro.json'; link.click();
    }

    function importarBase(ev) {
      const file = ev.target.files && ev.target.files.at(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            localStorage.setItem('ldb_custom_v3', JSON.stringify(data));
            db = [...base, ...data];
            init(); alert('¡Patentes y fichas cargadas con éxito!');
          }
        } catch { alert('Archivo inválido'); }
      };
      reader.readAsText(file);
    }

    document.getElementById('fg').onsubmit = e => {
      e.preventDefault();
      const p = document.getElementById('np').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const v = document.getElementById('nv').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const n = {
        p: p ? [p] : [], v: v ? [v] : [],
        m: document.getElementById('nm').value.trim(), mo: document.getElementById('nmo').value.trim(),
        a: +document.getElementById('na').value, ve: document.getElementById('nve').value.trim(),
        mc: document.getElementById('nmc').value, cj: document.getElementById('ncj').value,
        ma: document.getElementById('nma').value, ml: +document.getElementById('nml').value || 0,
        aa: document.getElementById('naa').value, al: +document.getElementById('nal').value || 0,
        fc: document.getElementById('nfc').value, fm: document.getElementById('nfm').value
      };
      guardados.push(n);
      localStorage.setItem('ldb_custom_v3', JSON.stringify(guardados));
      db = [...base, ...guardados];
      init(); document.getElementById('mod').style.display = 'none'; show(n, p || v); e.target.reset();
    };
  </script>
